<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101218">
  <title>GARHI | WE Technical Copilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">G</div>
    <div>
      <h1>GARHI</h1>
      <p>مساعد الدعم الفني لـ WE</p>
    </div>
    <button id="clearChat" class="clear">محادثة جديدة</button>
  </header>

  <main id="chat" class="chat">
    <section class="welcome" id="welcome">
      <div class="hero-icon">G</div>
      <h2>أهلًا بيك في GARHI</h2>
      <p>اسأل عن أعطال الإنترنت الأرضي وإجراءات الدعم الفني.</p>
      <div class="suggestions">
        <button data-question="اشرح حالة BLQ">ما معنى BLQ؟</button>
        <button data-question="ما خطوات التعامل مع Data Down؟">Data Down</button>
        <button data-question="اشرح خطوات متابعة SR و SLA">متابعة SR و SLA</button>
      </div>
    </section>
  </main>

  <form id="chatForm" class="composer">
    <textarea id="message" rows="1" placeholder="اكتب سؤالك هنا..." required></textarea>
    <button id="send" type="submit" aria-label="إرسال">➤</button>
  </form>

  <footer>GARHI · مساعد تقني مستقل · لا تدخل بيانات العملاء الشخصية</footer>
  <script type="module" src="js/local-chat.js"></script>
</body>
</html>
